[platformio]
default_envs = esp32dev

[env]
framework = arduino

[env:esp32dev]
board = esp32dev
platform = espressif32
build_flags = -DLED_BUILTIN=2

[env:esp32-s3]
board = esp32-s3-devkitc-1
platform = espressif32

[env:esp32-s2]
board = esp32-s2-saola-1
platform = espressif32

[env:esp32-c3]
board = esp32-c3-devkitm-1
platform = espressif32

[env:esp8266]
board = esp12e
platform = espressif8266
build_flags = -DLED_ACTIVE_LOW

[env:esp8285]
board = esp8285
platform = espressif8266
build_flags = -DLED_ACTIVE_LOW